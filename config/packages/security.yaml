security:
    password_hashers:
        App\Entity\User:
            algorithm: bcrypt
            cost: 13

    providers:
        app_user_provider:
            entity:
                class: App\Entity\User
                property: username

    firewalls:
        dev:
            pattern: ^/(_profiler|_wdt|assets|build)/
            security: false
        main:
            lazy: true
            provider: app_user_provider
            form_login:
                login_path: app_login
                check_path: app_login
                username_parameter: _username
                password_parameter: _password
                default_target_path: insights_dashboard
                always_use_default_target_path: false
            logout:
                path: app_logout
                target: app_login
            remember_me:
                secret: '%kernel.secret%'
                lifetime: 604800

    role_hierarchy:
        ROLE_SYSADMIN:  [ROLE_ADMIN]
        ROLE_ADMIN:     [ROLE_CENTRE_ADMIN, ROLE_EXECUTIVE]
        ROLE_EXECUTIVE: [ROLE_CENTRE_ADMIN]
        ROLE_CENTRE_ADMIN: [ROLE_CLERK]
        ROLE_CLERK:     [ROLE_VOLUNTEER]
        ROLE_VOLUNTEER: [ROLE_VIEWER, ROLE_USER]
        ROLE_VIEWER:    [ROLE_USER]

    access_control:
        - { path: ^/login,   roles: PUBLIC_ACCESS }
        - { path: ^/connect, roles: PUBLIC_ACCESS }
        - { path: ^/,        roles: ROLE_USER }

when@test:
    security:
        password_hashers:
            App\Entity\User:
                algorithm: auto
                cost: 4
